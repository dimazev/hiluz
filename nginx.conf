server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/xml image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { try_files $uri $uri/ =404; expires 1h; }
  location ~* \.(png|jpe?g|webp|avif|svg|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
