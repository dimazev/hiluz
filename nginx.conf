server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/xml application/javascript image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Umami analytics + session recorder served first-party: no third-party cookies / CORS issues,
  # and the scripts get proper cache headers. Resolved per request, so nginx still starts if Umami is down.
  resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
  location ~ ^/stats/(.*)$ {
    set $umami "https://umami.dzev.net/$1$is_args$args";
    proxy_pass $umami;
    proxy_ssl_server_name on;
    proxy_set_header Host umami.dzev.net;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header User-Agent $http_user_agent;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Access-Control-Allow-Origin;
    client_max_body_size 5m;
    proxy_read_timeout 15s;
    location ~ \.js$ { expires 1d; }
  }

  location / { try_files $uri $uri/ =404; expires 1h; }
  location ~* \.(png|jpe?g|webp|avif|svg|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
}
