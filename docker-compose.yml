services:
  web:
    build:
      context: .
      args:
        DOMAIN: ${DOMAIN:-https://example.co.il}
    image: hilutzei-shetach:latest
    container_name: hilutzei-shetach
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
